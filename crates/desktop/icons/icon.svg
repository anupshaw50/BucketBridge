<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>BucketBridge</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D6E4FF"/>
    </linearGradient>
  </defs>
  <!-- Tile on the 824 px macOS icon grid, leaving a transparent margin. -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#tile)"/>
  <g transform="translate(0 -16)">
    <!-- Tied-arch bridge: arch and hangers standing on the bucket rim. -->
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
      <path d="M 236 488 A 276 214 0 0 1 788 488" stroke-width="48"/>
      <path d="M 328 340 V 470 M 420 294 V 470 M 512 278 V 470 M 604 294 V 470 M 696 340 V 470" stroke-width="18"/>
    </g>
    <!-- Bucket rim, which doubles as the bridge deck. -->
    <rect x="180" y="466" width="664" height="56" rx="28" fill="#FFFFFF"/>
    <!-- Tapered bucket body with a curved base and one hoop. -->
    <path d="M 268 546 H 756 L 694.8 773.3 Q 688 790 664 794 Q 512 822 360 794 Q 336 790 329.2 773.3 Z" fill="url(#body)"/>
    <path d="M 300 662 Q 512 690 724 662" fill="none" stroke="#1B5E8C" stroke-width="14" stroke-linecap="round" opacity="0.55"/>
  </g>
</svg>
